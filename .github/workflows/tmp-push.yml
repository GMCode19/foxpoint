name: tmp-push
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://udjviairelbvohdfwhhb.supabase.co/functions/v1/push
          echo "== POST init"; curl -sS -m 30 -X POST $U -H 'Content-Type: application/json' -d '{"init":true}' -w '\nHTTP %{http_code}\n' | sed -E 's/"publicKey":"(.{12}).*"/"publicKey":"\1..."/'
          echo "== OPTIONS (preflight dal browser)"; curl -sS -m 30 -i -X OPTIONS $U -H 'Origin: https://gmcode19.github.io' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' | grep -iE '^HTTP|access-control' 
          echo "== POST senza segreto (atteso 401 dalla funzione)"; curl -sS -m 30 -X POST $U -H 'Content-Type: application/json' -d '{}' -w '\nHTTP %{http_code}\n'
