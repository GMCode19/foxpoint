name: Aggiorna classifica PBI

on:
  schedule:
    - cron: '17 5 * * *'   # ogni mattina verso le 6-7 ora italiana
  workflow_dispatch:         # pulsante "Run workflow" per aggiornarla subito
    inputs:
      solo_prova:
        description: 'Solo prova: legge la classifica e mostra cosa farebbe, senza modificare nulla'
        type: boolean
        default: false

concurrency:
  group: sync-pbi
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/sync-pbi.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SOLO_PROVA: ${{ inputs.solo_prova && 'true' || 'false' }}
